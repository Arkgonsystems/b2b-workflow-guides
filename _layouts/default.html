<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Arkgon Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafafa; color: #0f172a; font-family: "Inter", -apple-system, sans-serif; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    .topbar { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 50; }
    .topbar-inner { max-width: 960px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #0f172a; text-decoration: none; text-transform: uppercase; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { font-size: 13px; color: #475569; text-decoration: none; font-weight: 500; }
    .nav-links a:hover { color: #0f172a; }
    .nav-links .btn-pack { background: #0f172a; color: #ffffff; padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .container { max-width: 820px; margin: 40px auto 80px; padding: 0 24px; }
    .doc-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 44px 48px; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 12px; color: #0f172a; line-height: 1.25; }
    h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.015em; margin: 36px 0 14px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; color: #0f172a; }
    h3 { font-size: 15px; font-weight: 600; margin: 24px 0 10px; color: #1e293b; }
    p, li { font-size: 14.5px; color: #334155; }
    a { color: #0f172a; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
    pre { background: #0f172a; color: #f8fafc; padding: 18px 20px; border-radius: 8px; overflow-x: auto; font-family: "JetBrains Mono", monospace; font-size: 12.5px; line-height: 1.55; }
    code { font-family: "JetBrains Mono", monospace; font-size: 12.5px; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; color: #0f172a; }
    pre code { background: transparent; padding: 0; color: inherit; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13.5px; }
    th { background: #f8fafc; text-align: left; padding: 10px 12px; border: 1px solid #e2e8f0; font-weight: 600; color: #0f172a; }
    td { padding: 10px 12px; border: 1px solid #e2e8f0; color: #334155; }
    .subtle-meta { font-size: 11px; color: #94a3b8; margin-bottom: 24px; }
    .footer { max-width: 820px; margin: 0 auto 48px; padding: 0 24px; font-size: 11.5px; color: #94a3b8; display: flex; justify-content: space-between; }
    @media (max-width: 640px) { .doc-card { padding: 24px 20px; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://arkgonsystems.github.io/b2b-workflow-guides/">ARKGON SYSTEMS</a>
      <nav class="nav-links">
        <a href="https://arkgonsystems.github.io/b2b-workflow-guides/">Directory</a>
        <a href="https://arkgonsystems.github.io/b2b-workflow-guides/blueprints.html">JSON Blueprints</a>
        <a class="btn-pack" href="https://platypusprime.gumroad.com/l/dncmng" target="_blank" rel="noopener">Get Complete JSON Pack ($19)</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <article class="doc-card">
      {{ content }}
    </article>
  </main>
  <footer class="footer">
    <span>ARKGON SYSTEMS // Enterprise Workflow Architecture</span>
    <span>Independent technical publication. Outbound software links may include referral tracking.</span>
  </footer>
</body>
</html>
