<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arkgon Stellar | 60fps Interactive 3D Starfield Engine</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#04070f;color:#f8fafc;overflow:hidden}
header{border-bottom:1px solid rgba(30,41,59,0.7);background:rgba(4,7,15,0.75);position:fixed;top:0;left:0;right:0;z-index:20;backdrop-filter:blur(10px);padding:16px 24px}
.nav{max-width:1140px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.brand{color:#fff;font-weight:800;text-decoration:none;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#38bdf8;box-shadow:0 0 10px #38bdf8}
.nav-links{display:flex;gap:16px;align-items:center}.nav-links a{color:#94a3b8;text-decoration:none;font-size:13px;font-weight:600}
.nav-cta{background:#38bdf8;color:#020617 !important;padding:7px 14px;border-radius:6px;font-weight:800 !important}
#stage{position:fixed;inset:0;width:100vw;height:100vh;z-index:1}
.hud{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(13,19,34,0.78);border:1px solid rgba(56,189,248,0.3);backdrop-filter:blur(12px);padding:20px 32px;border-radius:14px;text-align:center;max-width:560px;width:90%}
.hud h1{margin:0 0 6px;font-size:22px;letter-spacing:0.04em}
.hud p{margin:0 0 14px;color:#94a3b8;font-size:13px}
.btn{background:#38bdf8;color:#020617;font-weight:800;padding:9px 18px;border-radius:6px;text-decoration:none;font-size:13px;display:inline-block}
</style></head><body>
<header><div class="container nav">
  <a class="brand" href="https://arkgonsystems.github.io/b2b-workflow-guides/"><span class="dot"></span>ARKGON SYSTEMS</a>
  <div class="nav-links">
    <a href="https://arkgonsystems.github.io/b2b-workflow-guides/#specs">Blueprints (21)</a>
    <a href="https://arkgonsystems.github.io/b2b-workflow-guides/blueprints.html">JSON Catalog</a>
    <a href="https://arkgonsystems.github.io/b2b-workflow-guides/slidenote.html">SlideNote</a>
    <a href="https://arkgonsystems.github.io/b2b-workflow-guides/editorial-studio.html">Polisher v2.0</a>
    <a href="https://arkgonsystems.github.io/b2b-workflow-guides/stellar.html" style="color:#38bdf8;">Stellar 60fps</a>
    <a class="nav-cta" href="https://platypusprime.gumroad.com/l/dncmng">Full Vault ($19)</a>
  </div>
</div></header>
<div id="stage"><canvas id="star-canvas"></canvas></div>
<div class="hud">
  <div style="font-size:11px;color:#38bdf8;font-weight:800;letter-spacing:0.1em;margin-bottom:4px">ARKGON STELLAR // 60FPS CANVAS ENGINE</div>
  <h1>Interactive 3D Starfield</h1>
  <p>Move cursor for 3D parallax &bull; Click and hold anywhere for Warp Drive</p>
  <a class="btn" href="https://github.com/Arkgonsystems/Stellar">View Source on GitHub &rarr;</a>
</div>
<script>
(function(){
  var c=document.getElementById("star-canvas");if(!c)return;
  var ctx=c.getContext("2d"),w,h,stars=[],count=700,speed=2.2,warp=false,mx=0,my=0;
  function resize(){w=c.width=c.parentElement.clientWidth||window.innerWidth;h=c.height=c.parentElement.clientHeight||420;}
  window.addEventListener("resize",resize);resize();
  for(var i=0;i<count;i++)stars.push({x:(Math.random()-0.5)*w*2,y:(Math.random()-0.5)*h*2,z:Math.random()*w,pz:0,col:i%5===0?"#38bdf8":(i%7===0?"#10b981":"#f8fafc")});
  window.addEventListener("mousemove",function(e){mx=(e.clientX-w/2)*0.08;my=(e.clientY-h/2)*0.08;});
  window.addEventListener("mousedown",function(){warp=true;});
  window.addEventListener("mouseup",function(){warp=false;});
  function tick(){
    ctx.fillStyle=warp?"rgba(4,7,15,0.22)":"rgba(4,7,15,0.45)";
    ctx.fillRect(0,0,w,h);
    var v=warp?18:speed,cx=w/2+mx,cy=h/2+my;
    for(var i=0;i<count;i++){
      var s=stars[i];s.pz=s.z;s.z-=v;
      if(s.z<=1){s.z=w;s.pz=w;s.x=(Math.random()-0.5)*w*2;s.y=(Math.random()-0.5)*h*2;}
      var sx=(s.x/s.z)*w+cx,sy=(s.y/s.z)*h+cy;
      var px=(s.x/s.pz)*w+cx,py=(s.y/s.pz)*h+cy;
      var r=Math.max(0.6,(1-s.z/w)*2.6);
      ctx.beginPath();ctx.strokeStyle=s.col;ctx.lineWidth=r;ctx.moveTo(px,py);ctx.lineTo(sx,sy);ctx.stroke();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body></html>
