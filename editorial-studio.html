<title>Arkgon Polisher v2.0 (Editorial Studio) | Client-Side Prose Reframer</title>
<style>*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#03060e;color:#f8fafc;line-height:1.6;overflow-x:hidden}
.page-wrap{position:relative;z-index:2}
.container{max-width:1140px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid rgba(56,189,248,0.18);background:rgba(3,6,14,0.72);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);padding:16px 0}
.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.brand{color:#fff;font-weight:800;font-size:15px;letter-spacing:0.06em;text-decoration:none;display:flex;align-items:center;gap:9px}

.nav-links{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.nav-links a{color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:600}.nav-links a:hover{color:#38bdf8}
.nav-cta{background:#38bdf8;color:#020617 !important;padding:7px 15px;border-radius:6px;font-weight:800 !important}
.landing-hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 24px}

.sub{color:#cbd5e1;font-size:17px;max-width:660px;margin:0 auto 28px}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-main{background:#10b981;color:#022c22;padding:13px 24px;border-radius:8px;font-weight:800;text-decoration:none;font-size:14px;border:none;cursor:pointer;display:inline-block}
.btn-sec{background:rgba(15,23,42,0.8);color:#fff;padding:13px 24px;border-radius:8px;font-weight:700;text-decoration:none;font-size:14px;border:1px solid rgba(148,163,184,0.35);cursor:pointer;display:inline-block}
.suite-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin:24px 0 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-bottom:64px}
.glass-card{background:rgba(11,17,32,0.72);border:1px solid rgba(56,189,248,0.2);backdrop-filter:blur(12px);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color 0.15s,transform 0.15s}
.glass-card:hover{border-color:#38bdf8;transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill{background:rgba(56,189,248,0.14);color:#38bdf8;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:99px}
.spec-num{font-family:monospace;font-size:12px;color:#94a3b8}
.stack-tag{font-size:12px;color:#cbd5e1;font-weight:700;margin-bottom:6px}
.glass-card h3{margin:0 0 8px;font-size:17.5px}.glass-card h3 a{color:#fff;text-decoration:none}
.desc{color:#94a3b8;font-size:13.5px;margin:0 0 16px}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)}
.btn-spec{color:#38bdf8;text-decoration:none;font-size:13px;font-weight:700}
.btn-json{background:rgba(16,185,129,0.16);color:#10b981;border:1px solid rgba(16,185,129,0.35);padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:800;cursor:pointer}
pre{background:rgba(2,4,9,0.88);border:1px solid rgba(56,189,248,0.2);padding:14px;border-radius:8px;overflow-x:auto;color:#38bdf8;font-size:12px}
@media(max-width:768px){h1{font-size:32px}.hero-glass{padding:32px 20px}}.studio{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}textarea{width:100%;height:250px;background:rgba(6,10,20,0.85);border:1px solid rgba(56,189,248,0.3);border-radius:10px;color:#f8fafc;padding:14px;font-size:14px;line-height:1.55}select{background:rgba(15,23,42,0.9);color:#fff;border:1px solid rgba(56,189,248,0.35);padding:11px 16px;border-radius:8px;font-weight:700;font-size:13.5px}@media(max-width:768px){.studio{grid-template-columns:1fr}}</style></head><body>
<canvas id="bg-stars" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;"></canvas>
<script>
(function(){
  var c=document.getElementById("bg-stars");if(!c)return;
  var ctx=c.getContext("2d"),w,h,stars=[],count=1600,speed=2.4,warp=false,mx=0,my=0;
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
  window.addEventListener("resize",resize);resize();
  for(var i=0;i<count;i++){
    stars.push({
      x:(Math.random()-0.5)*w*2.6,
      y:(Math.random()-0.5)*h*2.6,
      z:Math.random()*w,
      pz:0,
      col:i%4===0?"#38bdf8":(i%6===0?"#10b981":(i%9===0?"#a5b4fc":"#ffffff"))
    });
  }
  window.addEventListener("mousemove",function(e){mx=(e.clientX-w/2)*0.11;my=(e.clientY-h/2)*0.11;});
  window.addEventListener("mousedown",function(e){if(e.target.tagName!=="BUTTON"&&e.target.tagName!=="A"&&e.target.tagName!=="TEXTAREA"&&e.target.tagName!=="SELECT")warp=true;});
  window.addEventListener("mouseup",function(){warp=false;});
  function tick(){
    ctx.fillStyle=warp?"rgba(3,6,14,0.2)":"rgba(3,6,14,0.42)";
    ctx.fillRect(0,0,w,h);
    var v=warp?22:speed,cx=w/2+mx,cy=h/2+my;
    for(var i=0;i<count;i++){
      var s=stars[i];s.pz=s.z;s.z-=v;
      if(s.z<=1){s.z=w;s.pz=w;s.x=(Math.random()-0.5)*w*2.6;s.y=(Math.random()-0.5)*h*2.6;}
      var sx=(s.x/s.z)*w+cx,sy=(s.y/s.z)*h+cy;
      var px=(s.x/s.pz)*w+cx,py=(s.y/s.pz)*h+cy;
      var r=Math.max(0.55,(1-s.z/w)*2.8);
      ctx.beginPath();ctx.strokeStyle=s.col;ctx.lineWidth=r;ctx.moveTo(px,py);ctx.lineTo(sx,sy);ctx.stroke();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

<main class="container" style="padding-top:36px;padding-bottom:64px">
<div class="glass-card">
  <div><span class="eyebrow">LIVE CLIENT-SIDE ENGINE &bull; POLISHER v2.0</span>
  <h1 style="font-size:32px;margin:12px 0 8px">Arkgon Editorial Studio (Polisher v2.0)</h1>
  <div style="display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap">
    <select id="mode" onchange="polishNow()"><option value="exec">Mode 1: Executive Brief (Concise &amp; Direct)</option><option value="tech">Mode 2: Technical Spec (Precision Active)</option><option value="burst">Mode 3: High-Cadence Burstiness (Split Long Clauses)</option></select>
    <button class="btn-main" onclick="polishNow()">Polish &amp; Reframe Text</button>
    <button class="btn-sec" onclick="copyPolished(this)">Copy Output</button>
  </div>
  <div class="studio">
    <div><label style="font-size:11px;color:#94a3b8;font-weight:700;display:block;margin-bottom:6px">INPUT TEXT (PASTE ANY DRAFT)</label><textarea id="inp" oninput="polishNow()">Furthermore, it is important to note that our organization utilizes complex webhook architectures in order to facilitate seamless data synchronization across multiple enterprise endpoints. Consequently, this methodology significantly reduces operational overhead and ensures comprehensive reliability for all stakeholders involved in the process.</textarea></div>
    <div><label style="font-size:11px;color:#38bdf8;font-weight:700;display:block;margin-bottom:6px">POLISHED OUTPUT</label><textarea id="out" readonly></textarea></div>
  </div>
  <div id="stat-bar" style="margin-top:14px;font-size:13px;color:#cbd5e1"></div></div>
</div></main></div>
<script>
var PAIRS=[
  ["furthermore, ",""],["moreover, ",""],["additionally, ","Also, "],["consequently, ","As a result, "],
  ["it is important to note that ",""],["it should be noted that ",""],["in order to ","to "],
  ["for the purpose of ","to "],["with regard to ","on "],["in light of the fact that ","because "],
  ["due to the fact that ","because "],["at this point in time","now"],["in the event that ","if "],
  ["utilizes","uses"],["utilize","use"],["utilization","use"],["facilitates","enables"],["facilitate","enable"],
  ["endeavor","try"],["demonstrates","shows"],["demonstrate","show"],["subsequently","next"],
  ["nevertheless","still"],["nonetheless","still"],["methodology","method"],["methodologies","methods"],
  ["seamless ","direct "],["seamlessly ","directly "],["comprehensive ","full "],["significantly reduces","cuts"],
  ["operational overhead","manual work"],["for all stakeholders involved in the process","across teams"],
  ["is responsible for ","directs "],["are responsible for ","direct "],["make a decision","decide"],
  ["conduct an analysis of","analyze"],["take into consideration","consider"],["on a daily basis","daily"]
];
function calcSigma(t){
  var s=t.split(/[.!?]+/).map(function(x){return x.trim();}).filter(Boolean);
  if(s.length<2)return "3.8";
  var l=s.map(function(x){return x.split(" ").filter(Boolean).length;});
  var m=l.reduce(function(a,b){return a+b;},0)/l.length;
  var v=l.reduce(function(a,b){return a+Math.pow(b-m,2);},0)/l.length;
  return Math.sqrt(v).toFixed(2);
}
function polishNow(){
  var raw=document.getElementById("inp").value||"";
  var mode=document.getElementById("mode").value;
  var res=raw; var hits=0;
  for(var i=0;i<PAIRS.length;i++){
    var re=new RegExp(PAIRS[i][0],"gi");
    if(re.test(res)){hits++;res=res.replace(re,PAIRS[i][1]);}
  }
  if(mode==="burst"){
    res=res.replace(/, and /g,". ").replace(/, which /g," — which ").replace(/; however, /gi,". Still, ");
  } else if(mode==="tech"){
    res=res.replace(/, and /g," and ").replace(/very /gi,"").replace(/extremely /gi,"");
  } else {
    res=res.replace(/, and /g," — and ");
  }
  res=res.replace(/(^|[.!?]\s+)([a-z])/g,function(m,p1,p2){return p1+p2.toUpperCase();});
  res=res.trim();
  document.getElementById("out").value=res;
  var w1=raw.trim()?raw.trim().split(" ").filter(Boolean).length:0;
  var w2=res?res.split(" ").filter(Boolean).length:0;
  document.getElementById("stat-bar").innerHTML="Mode: <strong style=\"color:#38bdf8\">"+mode.toUpperCase()+"</strong> &bull; Replacements: <strong style=\"color:#10b981\">"+hits+"</strong> &bull; Words: <strong>"+w1+" &rarr; "+w2+"</strong> &bull; Cadence (&sigma;): <strong>"+calcSigma(res)+"</strong>";
}
function copyPolished(btn){
  var val=document.getElementById("out").value;
  navigator.clipboard.writeText(val);
  var o=btn.innerText;btn.innerText="✓ Copied!";setTimeout(function(){btn.innerText=o;},1500);
}
polishNow();
</script></body></html>
